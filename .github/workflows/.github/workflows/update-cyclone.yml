name: Actualisation Nova Screen Cyclone

on:
  workflow_dispatch:
  schedule:
    # Saint-Barthélemy = UTC-4 toute l'année
    # 06:00 SBH = 10:00 UTC
    # 12:00 SBH = 16:00 UTC
    - cron: "0 10,16 * * *"

permissions:
  contents: write

concurrency:
  group: nova-screen-cyclone-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Actualiser les données cycloniques
        run: python update_cyclone.py

      - name: Publier la mise à jour
        shell: bash
        run: |
          set -e

          git config user.name "Nova Screen Bot"
          git config user.email "novascreen-bot@users.noreply.github.com"

          git add index.html data/cyclone.json

          if git diff --cached --quiet; then
            echo "Aucun changement à publier"
            exit 0
          fi

          git commit -m "Actualisation cyclone automatique"

          echo "Synchronisation avec le dernier état de main..."
          git fetch origin main
          git rebase origin/main

          echo "Envoi vers GitHub..."
          if ! git push origin HEAD:main; then
            echo "Le dépôt a changé pendant le push. Nouvelle tentative..."
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
