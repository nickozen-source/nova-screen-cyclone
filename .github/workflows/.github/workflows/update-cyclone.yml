name: Actualisation Nova Screen Cyclone

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions utilise UTC.
    # Saint-Barthélemy = UTC-4 toute l'année.
    # 06:00 SBH = 10:00 UTC
    # 12:00 SBH = 16:00 UTC
    - cron: "0 10,16 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Actualiser la situation cyclonique
        run: python update_cyclone.py

      - name: Publier si quelque chose a changé
        run: |
          git config user.name "Nova Screen Bot"
          git config user.email "novascreen-bot@users.noreply.github.com"

          git add index.html data/cyclone.json

          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Actualisation cyclone automatique"
            git push
          fi
