name: Mise à jour cyclone Nova Screen

on:
  schedule:
    - cron: '5 6,12 * * *'
      timezone: "America/St_Barthelemy"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          pip install requests beautifulsoup4

      - name: Actualiser les données cycloniques
        run: |
          python update_cyclone.py

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "Nova Screen Bot"
          git config user.email "novascreen-bot@users.noreply.github.com"

          git add data/cyclone.json

          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Mise à jour cyclone automatique"
            git push
          fi
